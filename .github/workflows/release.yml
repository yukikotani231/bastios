# Builds a release from a version tag. Nothing here runs until a tag
# `vX.Y.Z` is pushed (or the workflow is started by hand), and what it
# creates is a *draft* GitHub release: publishing it is a separate, manual
# step. See docs/releasing.md.
name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build, e.g. v0.2.0 (artifacts only, no release)'
        required: true
      bastiolang_ref:
        description: 'bastiolang tag or branch to build the kernel with'
        required: true
        default: main
permissions:
  contents: read
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # For a pushed tag: the bastiolang version this BastiOS release is built
  # with. Set it to a bastiolang release tag once there is one.
  BASTIOLANG_REF: ${{ github.event.inputs.bastiolang_ref || 'main' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # bastiolang is private for now; see the note in ci.yml. Once it is
      # public, drop the token line.
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: ${{ env.BASTIOLANG_REF }}
          path: bastiolang
          token: ${{ secrets.BASTIOLANG_TOKEN }}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 qemu-system-x86 musl-tools xorriso ovmf
      - name: The tag matches the boot banner and the changelog
        run: |
          version=${TAG#v}
          grep -q "BastiOS ${version%.*}:" src/main.bastio || { echo "::error::src/main.bastio does not print BastiOS ${version%.*}"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Tests (they also build the kernel and the ISO)
        run: make test BASTIOC=bastiolang/stage0/target/release/bastioc0
      - name: Package
        run: |
          make iso BASTIOC=bastiolang/stage0/target/release/bastioc0
          mkdir -p dist
          cp build/bastios.iso dist/bastios-$TAG.iso
          cp build/bastios.elf dist/bastios-$TAG.elf
          # The kernel image embeds BusyBox, which is GPL-2.0-only: its
          # complete source goes out next to the binaries.
          git -C build/busybox archive --format=tar.gz --prefix=busybox-1.36.1/ -o "$PWD/dist/busybox-1.36.1-source.tar.gz" HEAD
          cp user/busybox.config dist/busybox-$TAG.config
          {
            awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && !/^\[[^]]*\]: /' CHANGELOG.md
            echo
            echo "Built with bastiolang $(git -C bastiolang rev-parse HEAD) ($BASTIOLANG_REF)."
            echo
            echo "The kernel image includes BusyBox 1.36.1 (GPL-2.0-only), built from the attached source with the attached configuration."
          } > dist/notes.md
          (cd dist && sha256sum bastios-* busybox-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: bastios-${{ env.TAG }}
          path: dist/
  draft-release:
    # Only for a pushed tag, not for a build started by hand.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bastios-${{ github.ref_name }}
          path: dist
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "BastiOS $GITHUB_REF_NAME" --notes-file dist/notes.md \
            dist/bastios-* dist/busybox-* dist/SHA256SUMS
