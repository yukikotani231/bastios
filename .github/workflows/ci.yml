name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # bastiolang is private for now, and the workflow token cannot read it.
  # Until a BASTIOLANG_TOKEN secret (read access to bastiolang) is set, the
  # test job is skipped, which GitHub shows as skipped, not passed. Once
  # bastiolang is public, drop this gate and the token line.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.BASTIOLANG_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo ok=true >> "$GITHUB_OUTPUT"
          else echo "::warning::BASTIOLANG_TOKEN is not set; skipping the QEMU test"; fi
  test:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
          token: ${{ secrets.BASTIOLANG_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y z3 qemu-system-x86 musl-tools
      - name: Tool versions
        run: |
          echo "bastiolang $(git -C bastiolang rev-parse HEAD)"
          (cd bastiolang && rustc --version)
          z3 --version
          cc --version | head -1
          qemu-system-x86_64 --version | head -1
          python3 --version
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - run: make test BASTIOC=bastiolang/stage0/target/release/bastioc0
