name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: sudo apt-get update && sudo apt-get install -y z3 qemu-system-x86 musl-tools
      - name: Tool versions
        run: |
          echo "bastiolang $(git -C bastiolang rev-parse HEAD)"
          (cd bastiolang && rustc --version)
          z3 --version
          cc --version | head -1
          qemu-system-x86_64 --version | head -1
          python3 --version
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - run: make test BASTIOC=bastiolang/stage0/target/release/bastioc0
