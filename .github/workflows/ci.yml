name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASTIOC0: bastiolang/stage0/target/release/bastioc0
      BASTIOLIB: bastiolang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: |
          sudo apt-get update
          sudo apt-get install -y z3 qemu-system-x86 musl-tools
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-x86-64-
            proof-
          path: build/proof-cache
      - run: make build/bastios.elf
      - run: tools/ci-kvm.sh
      - name: MON=1 NIC=e1000
        run: MON=1 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: MON=1 SEED=3 NIC=e1000
        run: MON=1 SEED=3 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: MON=1 SEED=4 NIC=e1000
        run: MON=1 SEED=4 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: MON=1 SMP=1 NIC=e1000
        run: MON=1 SMP=1 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: MON=1 SEED=5 NIC=e1000
        run: MON=1 SEED=5 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
