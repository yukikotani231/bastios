name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A pull request that only touches text nobody builds or runs (docs, the
  # changelog, templates) starts none of the jobs below: they are skipped,
  # which counts as passing. The README and the two guides test/guide_test.py
  # follows are code for this purpose.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # A push to main runs everything. While a run is going, GitHub keeps
          # only the newest waiting run for main and drops the others, so the
          # run that starts may cover several pushes while event.before names
          # only the last one; a docs-only last push would then skip the code
          # merged before it. A pull request with no usable base (a forced
          # push) runs everything too.
          if [ "$GITHUB_EVENT_NAME" = push ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "$files"
          code=$(echo "$files" | grep -vE '^(CHANGELOG|CONTRIBUTING|SECURITY)\.md$|^LICENSE|^\.github/(pull_request_template\.md|ISSUE_TEMPLATE/)|^test/compat/README\.md$|^docs/' || true)
          guides=$(echo "$files" | grep -E '^docs/(getting-started|using)\.md$' || true)
          if [ -n "$code$guides" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
  # test/all.sh in three parts that run on runners of their own (LANES, see
  # test/all.sh): the x86-64 boots in two halves, the shell and network
  # tests (a b) and the rest (c e), each about as long as the shell test,
  # and the AArch64 kernel's. The two x86-64 halves build the same kernel,
  # so they share one proof cache; the AArch64 part keeps its own, since
  # the caches are saved and restored whole.
  test:
    name: test (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: x86-64
            lanes: a b
            cache: x86-64
          - part: x86-64 rest
            lanes: c e
            cache: x86-64
          - part: aarch64
            lanes: d
            cache: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: sudo apt-get update && sudo apt-get install -y z3 qemu-system-x86 qemu-system-arm qemu-efi-aarch64 gcc-aarch64-linux-gnu musl-tools xorriso dosfstools mtools ovmf
      - name: Tool versions
        run: |
          echo "bastiolang $(git -C bastiolang rev-parse HEAD)"
          (cd bastiolang && rustc --version)
          z3 --version
          cc --version | head -1
          qemu-system-x86_64 --version | head -1
          python3 --version
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-${{ matrix.cache }}-none
          restore-keys: |
            proof-${{ matrix.cache }}-
            proof-
          path: build/proof-cache
      - run: make test BASTIOC0=bastiolang/stage0/target/release/bastioc0 BASTIOLIB=bastiolang
        env:
          AARCH64_REQUIRED: 1
          LANES: ${{ matrix.lanes }}
      - name: Save the proof cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          key: proof-${{ matrix.cache }}-${{ hashFiles('build/proof-cache/**') }}
          path: build/proof-cache
        continue-on-error: true
  # The same suite with the kernel and the Bastio user programs built by the
  # native x86-64 backend, so no C compiler sees any proved code (the C
  # compiler still builds boot/, the C library and the musl test programs).
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: sudo apt-get update && sudo apt-get install -y z3 qemu-system-x86 qemu-system-arm gcc-aarch64-linux-gnu musl-tools
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-x86-64-
            proof-
          path: build/proof-cache
      - run: make test NATIVE=1 LANES='a b ce' BASTIOC0=bastiolang/stage0/target/release/bastioc0 BASTIOLIB=bastiolang
      # The AArch64 port's Bastio user programs (shell, hello, spin, true) built
      # by the native AArch64 backend, booted once on QEMU virt.
      - run: test/aarch64_test.sh --build
        env:
          NATIVE: 1
          AARCH64_REQUIRED: 1
          BASTIOC0: bastiolang/stage0/target/release/bastioc0
          BASTIOLIB: bastiolang
  # bench/run.py under KVM: BastiOS and Linux (Ubuntu's generic kernel) in the
  # same QEMU machine, one core of each test per run. GitHub's hosted runners
  # offer /dev/kvm, so the figures are not the software-TLB artefacts of
  # TCG (docs/performance.md), and the table goes to the job summary. It runs
  # on every push to main, and on a pull request that touches bench/, this
  # job or tools/ci-kvm.sh; for any other pull request it only says so.
  bench-kvm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: want
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^bench/|^tools/ci-kvm\.sh$|^\.github/workflows/ci\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "bench-kvm: nothing under bench/ changed, skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.want.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - if: steps.want.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y z3 qemu-system-x86 musl-tools busybox-static cpio e2fsprogs
      - if: steps.want.outputs.run == 'true'
        run: cd bastiolang/stage0 && cargo build --release --locked
      - if: steps.want.outputs.run == 'true'
        name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-x86-64-
            proof-
          path: build/proof-cache
      - if: steps.want.outputs.run == 'true'
        run: make build/bastios.elf BASTIOC0=bastiolang/stage0/target/release/bastioc0 BASTIOLIB=bastiolang
      - if: steps.want.outputs.run == 'true'
        run: tools/ci-kvm.sh
      - if: steps.want.outputs.run == 'true'
        name: Run the benchmarks
        run: |
          bench/run.py --smp 2 --runs 3 --out build/bench/kvm.json | tee build/bench/kvm.md
          { echo '### bench/run.py under KVM'; echo; cat build/bench/kvm.md; } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.want.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-kvm
          path: |
            build/bench/kvm.json
            build/bench/kvm.md
          if-no-files-found: ignore
  # The AWS ENA driver against tools/qemu-ena, a model of the device built
  # into QEMU 8.2 (about 20 minutes, so the binary is cached by the hash of
  # the model's sources). The `test` job skips these boots; here they run
  # DHCP, TCP and IPv6 through the ENA queues.
  ena:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASTIOC0: bastiolang/stage0/target/release/bastioc0
      BASTIOLIB: bastiolang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: |
          sudo apt-get update
          sudo apt-get install -y z3 qemu-system-x86 musl-tools ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev libslirp-dev python3-venv flex bison
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Restore the patched QEMU
        id: qemu
        uses: actions/cache/restore@v4
        with:
          key: qemu-ena-${{ hashFiles('tools/qemu-ena/**') }}
          path: build/qemu-ena
      - name: Build the patched QEMU
        if: steps.qemu.outputs.cache-hit != 'true'
        run: tools/qemu-ena/build.sh
      - name: Save the patched QEMU
        if: steps.qemu.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: qemu-ena-${{ hashFiles('tools/qemu-ena/**') }}
          path: build/qemu-ena
        continue-on-error: true
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-x86-64-
            proof-
          path: build/proof-cache
      - run: make build/bastios.elf
      - run: NIC=ena test/dhcp_test.sh
      - run: NIC=ena test/tcp_test.sh
      - run: NIC=ena test/ipv6_test.sh
  # The Linux compatibility suite (test/compat). Most of its time on a fresh
  # runner goes to building third-party programs from source (Z3, CPython,
  # Perl, git, ...) and to fetching Alpine's images from Docker Hub, so both
  # are cached. The third-party programs are used only when every input
  # they were built from is unchanged: the pinned versions (every `?=`
  # setting in the Makefile), the BusyBox configuration, the patches and
  # pyzip.py. A change to a recipe alone is not seen: bump CACHE_V to
  # rebuild. Alpine's images are kept by digest and alpinedisk.py checks
  # each layer against its digest when it reads it from the cache, so an
  # older entry is restored when there is no exact one, and only the images
  # it lacks are fetched; they are saved from main only (an entry saved by a
  # pull request serves no other branch and fills the repository's cache
  # space). Disk images and everything built from this repository are never
  # cached. The caches are saved only after the build step succeeded, so a
  # build that failed halfway is never kept.
  compat:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Raise it to drop every cache entry below (a bad entry is never
      # replaced: a key that hits is not saved again).
      CACHE_V: 2
      BASTIOC0: bastiolang/stage0/target/release/bastioc0
      BASTIOLIB: bastiolang
    steps:
      # The third-party programs, Alpine's layers and the disk images together
      # fill much of the runner's disk. Deleting what the job does not use
      # takes minutes, so it runs beside the steps up to the disk build.
      - name: Make room
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: |
          sudo apt-get update
          sudo apt-get install -y z3 qemu-system-x86 musl-tools autoconf automake autopoint libtool \
            bison flex texinfo pkg-config tcl gettext
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Cache keys
        id: keys
        run: |
          echo "pins=$(grep -E '^[A-Z0-9_]+ *\?=' Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "images=$(grep -E '^[A-Z0-9_]+ *\?=' Makefile test/compat/images.mk | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the third-party programs
        id: tp
        uses: actions/cache/restore@v4
        with:
          key: compat-3p-${{ env.CACHE_V }}-${{ steps.keys.outputs.pins }}-rg-${{ hashFiles('test/compat/busybox.config', 'test/compat/patches/**', 'test/compat/pyzip.py') }}
          path: |
            build/busybox
            build/compat/src/tcc
            build/compat/busybox
            build/compat/dropbear
            build/compat/dbclient
            build/compat/dropbearkey
            build/compat/ssh_*
            build/compat/lua
            build/compat/qjs
            build/compat/sqlite3
            build/compat/micropython
            build/compat/kilo
            build/compat/git
            build/compat/perl
            build/compat/perllib
            build/compat/py
            build/compat/python
            build/compat/tcc
            build/compat/make
            build/compat/rg
            build/compat/z3
      # A restored program is older than the sources the checkout just
      # wrote, so make would build it again (CPython, from test/compat/
      # pyzip.py; tcc, from its patch). The key covers those inputs, so a
      # hit is up to date.
      - name: Mark the restored programs up to date
        if: steps.tp.outputs.cache-hit == 'true'
        run: find build/busybox build/compat -exec touch -h {} +
      - name: Restore Alpine's images
        id: al
        uses: actions/cache/restore@v4
        with:
          key: compat-alpine-${{ env.CACHE_V }}-${{ steps.keys.outputs.images }}-${{ hashFiles('test/compat/alpinedisk.py') }}
          restore-keys: compat-alpine-${{ env.CACHE_V }}-
          path: |
            build/compat/alpine/*.tar.gz
            build/compat/alpine/*.json
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-x86-64-
            proof-
          path: build/proof-cache
      - name: Wait for room
        run: |
          while pgrep -f 'rm -rf /usr/share/dotnet' >/dev/null; do sleep 5; done
          df -h /
      - name: Build the disks
        run: make -j4 compat-disks
      - name: Save the third-party programs
        if: steps.tp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: compat-3p-${{ env.CACHE_V }}-${{ steps.keys.outputs.pins }}-rg-${{ hashFiles('test/compat/busybox.config', 'test/compat/patches/**', 'test/compat/pyzip.py') }}
          path: |
            build/busybox
            build/compat/src/tcc
            build/compat/busybox
            build/compat/dropbear
            build/compat/dbclient
            build/compat/dropbearkey
            build/compat/ssh_*
            build/compat/lua
            build/compat/qjs
            build/compat/sqlite3
            build/compat/micropython
            build/compat/kilo
            build/compat/git
            build/compat/perl
            build/compat/perllib
            build/compat/py
            build/compat/python
            build/compat/tcc
            build/compat/make
            build/compat/rg
            build/compat/z3
        continue-on-error: true
      - name: Save Alpine's images
        if: github.event_name == 'push' && steps.al.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: compat-alpine-${{ env.CACHE_V }}-${{ steps.keys.outputs.images }}-${{ hashFiles('test/compat/alpinedisk.py') }}
          path: |
            build/compat/alpine/*.tar.gz
            build/compat/alpine/*.json
        continue-on-error: true
      - name: Run the x86-64 guests under KVM
        run: tools/ci-kvm.sh
      - run: make compat
      - name: What failed
        if: failure()
        run: |
          df -h /
          ls -la build/compat/alpine/disk build/compat/*.img build/compat/alpine-run.img || true
          tar -tf build/compat/alpine/disk/root.tar | head -3 || true
          grep -E '^\| [a-z0-9_-]+ \| .*\| fail \|' build/compat/report.md | cut -c1-1200 | head -30 || true
          tail -n 120 build/compat/serial.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: |
            build/compat/report.md
            build/compat/results.json
            build/compat/serial.log
          if-no-files-found: ignore
  # The Linux compatibility suite on AArch64 (arch/aarch64/Makefile): the
  # suite's C programs and a BusyBox against glibc, and Alpine, on QEMU's virt
  # machine. Every guest is emulated (TCG), so the lanes (test/compat/run.py)
  # are spread over four runners, each building only the disks of its
  # lanes (the two Alpine parts build the same disk and share its caches).
  # The last part runs every lane the others do not name, so a lane added
  # later runs there (its disk must be added to that part's list, or
  # run.py stops for want of it). Each part holds to the baseline every
  # check of the groups its lanes hold.
  compat-aarch64:
    name: compat-aarch64 (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: programs
            lanes: main1,bastio
            disks: disk.img bastio.img
          - part: alpine
            lanes: alpine,alpine2
            disks: alpine.img
            cache: alpine
          - part: alpine-dev
            lanes: alpine5
            disks: alpine.img
            cache: alpine
          - part: alpine-tools
            lanes: alpine3,alpine4
            disks: alpine.img
            cache: alpine
          - part: rest
            skip: main1,bastio,alpine,alpine2,alpine3,alpine4,alpine5
            disks: debian.img node.img
    env:
      # Raise it to drop the third-party cache entry below (a bad entry is
      # never replaced: a key that hits is not saved again).
      CACHE_V: 1
      COMPAT_LANES: ${{ matrix.lanes }}
      COMPAT_SKIP_LANES: ${{ matrix.skip }}
      BASTIOC0: bastiolang/stage0/target/release/bastioc0
      BASTIOLIB: bastiolang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: sudo apt-get update && sudo apt-get install -y z3 qemu-system-arm gcc-aarch64-linux-gnu g++-aarch64-linux-gnu tcl
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-aarch64-
            proof-
          path: build/proof-cache
      - name: Cache keys
        id: keys
        run: |
          echo "pins=$(grep -E '^[A-Z0-9_]+ *\?=' arch/aarch64/Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the third-party programs
        id: tp
        uses: actions/cache/restore@v4
        with:
          key: compat-3p-arm64-${{ matrix.cache || matrix.part }}-${{ env.CACHE_V }}-${{ steps.keys.outputs.pins }}-${{ hashFiles('test/compat/patches/**', 'test/compat/busybox.config') }}
          path: |
            build/aarch64/compat/z3
            build/aarch64/compat/tcc
            build/aarch64/compat/src/tcc
            build/aarch64/compat/musl
            build/aarch64/compat/dropbear
            build/aarch64/compat/runc
      # As in the compat job: a hit is up to date, though older than the
      # checkout's sources.
      - name: Mark the restored programs up to date
        if: steps.tp.outputs.cache-hit == 'true'
        run: find build/aarch64/compat -exec touch -h {} +
      - name: Restore Alpine's images
        id: al
        uses: actions/cache/restore@v4
        with:
          key: compat-alpine-arm64-${{ matrix.cache || matrix.part }}-${{ hashFiles('test/compat/images.mk', 'test/compat/alpinedisk.py') }}
          restore-keys: compat-alpine-arm64-${{ matrix.cache || matrix.part }}-
          path: |
            build/aarch64/compat/alpine/*.tar.gz
            build/aarch64/compat/alpine/*.json
      - name: Build the disks
        run: make -j4 ARCH=aarch64 compat-disks COMPAT_DISKS="$(printf 'build/aarch64/compat/%s ' ${{ matrix.disks }})"
      - name: Save the third-party programs
        if: steps.tp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: compat-3p-arm64-${{ matrix.cache || matrix.part }}-${{ env.CACHE_V }}-${{ steps.keys.outputs.pins }}-${{ hashFiles('test/compat/patches/**', 'test/compat/busybox.config') }}
          path: |
            build/aarch64/compat/z3
            build/aarch64/compat/tcc
            build/aarch64/compat/src/tcc
            build/aarch64/compat/musl
            build/aarch64/compat/dropbear
            build/aarch64/compat/runc
        continue-on-error: true
      - name: Save Alpine's images
        if: github.event_name == 'push' && steps.al.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: compat-alpine-arm64-${{ matrix.cache || matrix.part }}-${{ hashFiles('test/compat/images.mk', 'test/compat/alpinedisk.py') }}
          path: |
            build/aarch64/compat/alpine/*.tar.gz
            build/aarch64/compat/alpine/*.json
        continue-on-error: true
      - run: make ARCH=aarch64 compat COMPAT_DISKS="$(printf 'build/aarch64/compat/%s ' ${{ matrix.disks }})"
      - name: Checks that did not pass
        if: always()
        run: grep -E '^\| ' build/aarch64/compat/report.md | grep -v -E '\| pass \||\| ---' | head -80 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-aarch64-report-${{ matrix.part }}
          path: |
            build/aarch64/compat/report.md
            build/aarch64/compat/results.json
            build/aarch64/compat/serial.log
          if-no-files-found: ignore
  # The Linux Test Project's system call tests (test/compat/ltp.py), with
  # LTP built once per LTP_TAG and kept in the cache. The previous run's
  # results.json is kept too: ltp.py uses its timings to put the tests that
  # only wait out a timeout on machines of their own.
  compat-ltp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASTIOC0: bastiolang/stage0/target/release/bastioc0
      BASTIOLIB: bastiolang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: |
          sudo apt-get update
          sudo apt-get install -y z3 qemu-system-x86 musl-tools autoconf automake libtool pkg-config
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Cache keys
        id: keys
        run: echo "ltp=$(grep -E '^LTP_[A-Z]+ *\?=' Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore LTP
        id: ltp
        uses: actions/cache/restore@v4
        with:
          key: ltp-${{ steps.keys.outputs.ltp }}
          path: build/ltp
      - name: Restore the last run's timings
        uses: actions/cache/restore@v4
        with:
          key: ltp-times-${{ github.run_id }}
          restore-keys: ltp-times-
          path: build/compat/ltp/results.json
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-x86-64-
            proof-
          path: build/proof-cache
      - run: make -j4 build/bastios.elf build/ltp/.built
      - name: Save LTP
        if: steps.ltp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ltp-${{ steps.keys.outputs.ltp }}
          path: build/ltp
        continue-on-error: true
      - run: make compat-ltp
      - name: Save this run's timings
        if: always()
        uses: actions/cache/save@v4
        with:
          key: ltp-times-${{ github.run_id }}
          path: build/compat/ltp/results.json
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltp-report
          path: |
            build/compat/ltp/report.md
            build/compat/ltp/results.json
          if-no-files-found: ignore
