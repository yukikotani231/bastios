name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASTIOC0: bastiolang/stage0/target/release/bastioc0
      BASTIOLIB: bastiolang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yukikotani231/bastiolang
          ref: main
          path: bastiolang
      - run: |
          sudo apt-get update
          sudo apt-get install -y z3 qemu-system-x86 musl-tools
      - run: cd bastiolang/stage0 && cargo build --release --locked
      - name: Restore the proof cache
        uses: actions/cache/restore@v4
        with:
          key: proof-none
          restore-keys: |
            proof-x86-64-
            proof-
          path: build/proof-cache
      - run: make build/bastios.elf
      - run: tools/ci-kvm.sh
      - name: variant Y, no tick stretch
        run: |
          sed -i 's/  if s.slept != 0 || s.stop || !s.apic.on {/  if true || s.slept != 0 || s.stop || !s.apic.on {/' src/main.bastio
          git diff --stat
          make build/bastios.elf
      - name: Y NIC=e1000
        run: NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: Y SMP=1 NIC=e1000
        run: SMP=1 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: Y SEED=2 NIC=e1000
        run: SEED=2 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: Y SEED=3 NIC=e1000
        run: SEED=3 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: variant X, no e1000 interrupt
        run: |
          git checkout src/main.bastio
          sed -i 's/^        nic_irq_on(&mut nic);/        \/\/ nic_irq_on(\&mut nic);/' src/main.bastio
          git diff --stat
          make build/bastios.elf
      - name: X NIC=e1000
        run: NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: X SMP=1 NIC=e1000
        run: SMP=1 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: X SEED=2 NIC=e1000
        run: SEED=2 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
      - name: X SEED=3 NIC=e1000
        run: SEED=3 NIC=e1000 test/tcp_test.sh
        continue-on-error: true
