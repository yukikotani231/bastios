# Limine menu for build/bastios-installer.iso (make installer, docs/install.md).
# Both entries load the same kernel, which carries the installer; the first
# starts it with the boot option `install`, the second boots BastiOS from
# the media as the live ISO does, writing nothing to the machine's disks
# (an internal disk with a partition table is left alone).
timeout: 5
serial: yes

/Install BastiOS to a disk
    protocol: multiboot2
    path: boot():/boot/bastios.elf
    cmdline: install
    resolution: 1024x768x32

/Try BastiOS without installing
    protocol: multiboot2
    path: boot():/boot/bastios.elf
    resolution: 1024x768x32
