# GRUB menu for build/bastios.iso (make iso). GRUB loads the kernel as a
# Multiboot 2 image, under BIOS or UEFI, which also passes the ACPI RSDP
# (UEFI gives it to nobody else). The kernel asks for a 1024x768x32
# linear framebuffer in its Multiboot headers; GRUB sets one through VBE
# (BIOS) or GOP (UEFI) and BastiOS draws its console there as well as on
# the first serial port. GRUB itself talks on both.
set timeout=0
insmod all_video
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
menuentry "BastiOS" {
  set gfxpayload=1024x768x32,auto  # the mode the kernel asks for, else any
  multiboot2 /boot/bastios.elf
  boot
}
