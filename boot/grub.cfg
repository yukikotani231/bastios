# GRUB menu for build/bastios.iso (make iso). GRUB loads the kernel as a
# Multiboot image, under BIOS or UEFI. BastiOS talks on the first serial
# port only, so GRUB does too.
set timeout=0
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
menuentry "BastiOS" {
  set gfxpayload=keep             # no video mode to set: serial only
  multiboot /boot/bastios.elf
  boot
}
