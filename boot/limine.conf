# Limine menu for build/bastios.iso (make iso). Limine loads the kernel as
# a Multiboot 2 image, under BIOS or UEFI, which also passes the ACPI RSDP
# (UEFI gives it to nobody else). The kernel asks for a 1024x768x32
# linear framebuffer in its Multiboot headers; Limine sets one through VBE
# (BIOS) or GOP (UEFI) and BastiOS draws its console there as well as on
# the first serial port.
timeout: 0

/BastiOS
    protocol: multiboot2
    path: boot():/boot/bastios.elf
