# Limine menu for build/bastios.iso and the USB image (make iso, make usb).
# Limine loads the kernel as a Multiboot 2 image, under BIOS or UEFI, which
# also passes the ACPI RSDP (UEFI gives it to nobody else). The kernel asks
# for a 1024x768x32 linear framebuffer in its Multiboot headers; Limine sets
# one through VBE (BIOS) or GOP (UEFI), preferring that mode (`resolution`),
# and BastiOS draws its console there as well as on the first serial port.
# Limine itself talks on both (`serial`, 115200 baud).
#
# The second entry boots with `diag`: the kernel prints a hardware report
# (src/info.bastio) a screenful at a time, for trying BastiOS on a real
# machine (docs/real-hardware.md). The third boots with `login`: the
# console is BusyBox's login instead of the native shell
# (docs/security.md). The menu waits three seconds for them.
timeout: 3
serial: yes

/BastiOS
    protocol: multiboot2
    path: boot():/boot/bastios.elf
    resolution: 1024x768x32

/BastiOS, with a hardware report
    protocol: multiboot2
    path: boot():/boot/bastios.elf
    cmdline: diag
    resolution: 1024x768x32

/BastiOS, with a login prompt
    protocol: multiboot2
    path: boot():/boot/bastios.elf
    cmdline: login
    resolution: 1024x768x32
